services:
  backend:
    build:
      context: ./algojkl-backend
    env_file:
      - ./algojkl-backend/.env
    environment:
      PORT: 5042
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./algojkl-frontend
      args:
        VITE_CONTENTFUL_SPACE_ID: ${VITE_CONTENTFUL_SPACE_ID:?Set VITE_CONTENTFUL_SPACE_ID}
        VITE_CONTENTFUL_ACCESS_TOKEN: ${VITE_CONTENTFUL_ACCESS_TOKEN:?Set VITE_CONTENTFUL_ACCESS_TOKEN}
        VITE_CALENDAR_API: ${VITE_CALENDAR_API:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
